[package]
name = "fillrec"
version = "0.1.0"
edition = "2021"
description = "Multi-venue trade (fill) recorder: Binance spot, Binance USD-M perps, Coinbase, Polymarket -> one ledger schema in Apache Pinot"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rdkafka = { version = "0.37", features = ["cmake-build", "tokio"] }
hdrhistogram = "7"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "normalize"
harness = false

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only" # keep symbols for profiling

[profile.bench]
debug = "line-tables-only"
